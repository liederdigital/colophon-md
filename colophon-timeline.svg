<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 378" width="980" height="378" role="img" aria-labelledby="t d">
<title id="t">How COLOPHON.md was made, September 28 to October 30, 2026</title>
<desc id="d">One row each for a Grok bot, Claude, Codex, Cursor, and Ron Stauffer. A line passes between them: Ron proposes the idea in a Grok bot chat on September 28; the Grok bot writes the first file on September 30; Claude, Codex, and Cursor write more; Codex turns them into a skill on October 15; on launch day, October 30, Claude builds the site, Codex and the Grok bot research and review it, and Ron approves it.</desc>
