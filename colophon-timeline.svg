<g><title>Sep 28, 9:22 PM: Ron Stauffer. Proposed the idea and the name CREDITS.md, in a Grok bot chat.</title><path class="decided" d="M198.8 264 L206.8 272 L198.8 280 L190.8 272 Z"/></g>
<g><title>Sep 29, 12:00 PM: Grok bot. Built the template with Ron (per the bot&#x27;s notes, Sep 29 to Oct 1).</title><circle class="built" cx="207.5" cy="96" r="8"/></g>
<g><title>Sep 30, 8:06 PM: Grok bot. Added the first CREDITS.md, to a private iOS app.</title><circle class="built" cx="226.4" cy="96" r="8"/></g>
<g><title>Sep 30, 8:44 PM: Claude. Answered the bot&#x27;s open questions and checked its pull request.</title><circle class="reviewed" cx="226.8" cy="140" r="6.5"/></g>
<g><title>Oct 2, 4:41 PM: Ron Stauffer. Merged the first CREDITS.md.</title><path class="decided" d="M252.8 264 L260.8 272 L252.8 280 L244.8 272 Z"/></g>
<g><title>Oct 4, 10:58 PM: Claude. Pulled the idea out into a reusable kit: guide, template, skill.</title><circle class="built" cx="284.8" cy="140" r="8"/></g>
<g><title>Oct 4, 11:08 PM: Codex. Wrote the first CREDITS.md by Codex, for a private company site.</title><circle class="built" cx="284.9" cy="184" r="8"/></g>
<g><title>Oct 12, 5:36 PM: Claude. Wrote a CREDITS.md for a private Chrome extension.</title><circle class="built" cx="395.1" cy="140" r="8"/></g>
<g><title>Oct 13, 12:16 PM: Cursor. A CREDITS.md for a private WordPress plugin (committed as Cursor Agent).</title><circle class="built" cx="406.2" cy="228" r="8"/></g>
<g><title>Oct 15, 7:29 PM: Codex. Turned the examples into the repository-credits skill.</title><circle class="built" cx="438.8" cy="184" r="8"/></g>
<g><title>Oct 15, 7:50 PM: Claude. Saved the skill as a Claude skill.</title><circle class="built" cx="439.0" cy="140" r="8"/></g>
<g><title>Oct 29, 12:00 PM: Claude. Found ten repositories with a CREDITS.md.</title><circle class="reviewed" cx="632.9" cy="140" r="6.5"/></g>
<g><title>Oct 30, 6:15 PM: Claude. Built the public convention and this website.</title><circle class="built" cx="716.4" cy="140" r="8"/></g>
<g><title>Oct 30, 6:24 PM: Ron Stauffer. Put it live on Cloudflare Pages.</title><path class="decided" d="M726.2 264 L734.2 272 L726.2 280 L718.2 272 Z"/></g>
<g><title>Oct 30, 6:55 PM: Codex. Searched its own history for the origin.</title><circle class="reviewed" cx="760.0" cy="184" r="6.5"/></g>
<g><title>Oct 30, 7:20 PM: Grok bot. Found Ron&#x27;s September 28 message.</title><circle class="reviewed" cx="787.3" cy="96" r="6.5"/></g>
<g><title>Oct 30, 8:43 PM: Ron Stauffer. Connected colophon.md.</title><path class="decided" d="M877.8 264 L885.8 272 L877.8 280 L869.8 272 Z"/></g>
<g><title>Oct 30, 9:16 PM: Grok bot. Pre-launch review.</title><circle class="reviewed" cx="913.8" cy="96" r="6.5"/></g>
<g><title>Oct 30, 9:19 PM: Claude. Applied the review.</title><circle class="built" cx="917.1" cy="140" r="8"/></g>
<g><title>Oct 30, 9:22 PM: Ron Stauffer. Approved it for launch.</title><path class="decided" d="M920.4 264 L928.4 272 L920.4 280 L912.4 272 Z"/></g>
