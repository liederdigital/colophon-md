<svg class="timeline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 396" width="980" height="396" role="group" aria-labelledby="ct-title ct-desc">
<title id="ct-title">How this website was made, September 28 to October 30, 2026</title>
<desc id="ct-desc">One row each for a Grok bot, Claude, Codex, Cursor, and Ron Stauffer. Ron proposes the idea in a Grok bot chat on September 28; the Grok bot writes the first file on September 30; Claude, Codex, and Cursor write more; Codex turns them into a skill on October 15. On launch day, October 30, shown hour by hour, Claude builds the site, Codex and the Grok bot research and review it, and Ron approves it. Each mark is listed with its model in this site’s COLOPHON.md.</desc>
