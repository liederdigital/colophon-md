<g><title>Sep 28, 9:22 PM. Ron Stauffer, proposed. Proposed the idea and the name CREDITS.md. Model: Not applicable.</title><path class="tl-approved" d="M197.5 278 L205.5 286 L197.5 294 L189.5 286 Z"/></g>
<g><title>Sep 29 to Oct 1. Grok bot, built. Built the template with Ron. Model: Unknown.</title><circle class="tl-built" cx="205.8" cy="110" r="8"/></g>
<g><title>Sep 30, 8:06 PM. Grok bot, built. Added the first CREDITS.md, to a private iOS app. Model: Unknown.</title><circle class="tl-built" cx="223.9" cy="110" r="8"/></g>
<g><title>Sep 30, 8:44 PM. Claude, reviewed. Answered the bot&#x27;s open questions and checked its pull request. Model: Claude Opus 5.5 (from its commit trailers).</title><circle class="tl-reviewed" cx="224.2" cy="154" r="6.5"/></g>
<g><title>Oct 2, 4:41 PM. Ron Stauffer, approved. Merged the first CREDITS.md. Model: Not applicable.</title><path class="tl-approved" d="M249.0 278 L257.0 286 L249.0 294 L241.0 286 Z"/></g>
<g><title>Oct 4, 10:58 PM. Claude, built. Pulled the idea out into a reusable kit: a guide, a template, and a skill. Model: Unknown.</title><circle class="tl-built" cx="279.5" cy="154" r="8"/></g>
<g><title>Oct 4, 11:08 PM. Codex, built. Wrote its first CREDITS.md, for a private company site. Model: GPT-6-based; exact model Unknown.</title><circle class="tl-built" cx="279.6" cy="198" r="8"/></g>
<g><title>Oct 12, 5:36 PM. Claude, built. Wrote a CREDITS.md for a private Chrome extension. Model: Claude Opus 5.5 (from the file and its commit trailer).</title><circle class="tl-built" cx="384.6" cy="154" r="8"/></g>
<g><title>Oct 13, 12:16 PM. Cursor, built. Added a CREDITS.md to a private WordPress plugin. Model: Unknown.</title><circle class="tl-built" cx="395.2" cy="242" r="8"/></g>
<g><title>Oct 15, 7:29 PM. Codex, built. Turned the examples into the repository-credits skill. Model: Unknown.</title><circle class="tl-built" cx="426.2" cy="198" r="8"/></g>
<g><title>Oct 15, about 7:50 PM. Claude, built. Saved the skill as a Claude skill. Model: Unknown.</title><circle class="tl-built" cx="426.4" cy="154" r="8"/></g>
<g><title>Oct 29. Claude, researched. Found ten repositories with a CREDITS.md. Model: Unknown.</title><circle class="tl-reviewed" cx="611.2" cy="154" r="6.5"/></g>
<g><title>Oct 30, 6:15 PM. Claude, built. Built the public convention and this website. Model: Claude Opus 5.5 (configured).</title><circle class="tl-built" cx="689.7" cy="154" r="8"/></g>
<g><title>Oct 30, 6:24 PM. Ron Stauffer, deployed. Put it live on Cloudflare Pages. Model: Not applicable.</title><path class="tl-approved" d="M697.9 278 L705.9 286 L697.9 294 L689.9 286 Z"/></g>
<g><title>Oct 30, 6:55 PM. Codex, researched. Searched its own history for the origin. Model: GPT-6-Astra, high (shown by the tool).</title><circle class="tl-reviewed" cx="726.2" cy="198" r="6.5"/></g>
<g><title>Oct 30, about 7:20 PM. Grok bot, researched. Found Ron&#x27;s September 28 message. Model: Unknown.</title><circle class="tl-reviewed" cx="749.1" cy="110" r="6.5"/></g>
<g><title>Oct 30, 8:43 PM. Ron Stauffer, deployed. Connected colophon.md. Model: Not applicable.</title><path class="tl-approved" d="M824.9 278 L832.9 286 L824.9 294 L816.9 286 Z"/></g>
<g><title>Oct 30, 9:16 PM. Grok bot, reviewed. Pre-launch review: three fixes. Model: Unknown.</title><circle class="tl-reviewed" cx="855.0" cy="110" r="6.5"/></g>
<g><title>Oct 30, 9:19 PM. Claude, built. Applied the review. Model: Claude Opus 5.5 (configured).</title><circle class="tl-built" cx="857.8" cy="154" r="8"/></g>
